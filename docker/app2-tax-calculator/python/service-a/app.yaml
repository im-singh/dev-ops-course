apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-a
  labels:
    app: tax-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tax-a
  template:
    metadata:
      labels:
        app: tax-a
    spec:
      containers:
      - name: tax-a
        image: mohindersinghm81/tax-a
        imagePullPolicy: Always
        env:
        - name: FRONTEND_URL
          value: "http://localhost:3000"
        - name: TAX_SERVICE_URL
          value: "http://tax-b:4000"
---
apiVersion: v1
kind: Service
metadata:
  name: tax-a
  labels:
    app: tax-a
spec:
  type: NodePort
  selector:
    app: tax-a
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30750
