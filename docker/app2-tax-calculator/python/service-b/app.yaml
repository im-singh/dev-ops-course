apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-b
  labels:
    app: tax-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tax-b
  template:
    metadata:
      labels:
        app: tax-b
    spec:
      containers:
      - name: tax-b
        image: mohindersinghm81/tax-b
        imagePullPolicy: Always
        ports:
        - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: tax-b
  labels:
    app: tax-b
spec:
  type: ClusterIP
  selector:
    app: tax-b
  ports:
  - port: 4000
    targetPort: 4000