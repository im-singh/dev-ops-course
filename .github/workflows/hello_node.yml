name: second CI

on:
  push:
    # path:""
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: docker/app1-hello/node
        run: npm ci

      - name : Run Tests (If any)
        working-directory: docker/app1-hello/node
        run: npm test --if-present
  

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name : Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: docker/app1-hello/node
          push:  true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-node:latest
            ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hello-node:${{ github.ref_name }} 

