
name: Hello Spring Boot

on:
  push

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
            
      - name: Build with Maven
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -gB clean verify

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app1-hello/springboot/hello-spring/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR from docker
        working-directory: ./spring-boot-app
        run: echo "Building the project with Maven"

      - name: Login to DockerHub
        run: echo "Uploading test report"

      - name: Build and Push Docker Image
        run: echo "Building and pushing Docker image"
  
  